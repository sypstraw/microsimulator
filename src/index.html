function setcolor(col)
{
   if (col == 0) ctx.strokeStyle = "#000000";
   if (col == 2) ctx.strokeStyle = "#00AA00";
   if (col == 3) ctx.strokeStyle = "#00AAAA";
   if (col == 4) ctx.strokeStyle = "#AA0000";

   if (col == 0) ctx.fillStyle = "#000000";
   if (col == 2) ctx.fillStyle = "#00AA00";
   if (col == 3) ctx.fillStyle = "#00AAAA";
   if (col == 4) ctx.fillStyle = "#AA0000";
}

function clearviewport(x1, y1, x2, y2, col)
{
   setcolor(col);
   ctx.fillRect(x1,y1,x2-x1,y2-y1);
   setcolor(2);
}

function clearer(what, i)
{
   if (what == A1) clearviewport     (36*8-1,(13*16)+1,40*8+1,(14*16)-1,0);
   if (what == A2) clearviewport     (30*8-1,(13*16)+1,34*8+1,(14*16)-1,0);
   if (what == ALU) clearviewport    (27*8-1,(18*16)+1,43*8+1,(19*16)-1,0);
   if (what == BITS) clearviewport   (27*8-1,(18*16)+1,43*8+1,(19*16)-1,0);
   if (what == C) clearviewport      (35*8-1,(19.7*16)+1,36*8+1,(20.5*16)-1,0);
   if (what == CLOCK) clearviewport  (9*8-1,(2*16)+1,13*8+1,(3*16)-1,0);
   if (what == CONTROL) clearviewport(28*8-1,(4*16)+1,41*8+1,(5*16)-1,0);
   if (what == DATA) clearviewport   (49*8-1,(36*16)+1,53*8+1,(37*16)-1,0);
   if (what == ENTRY) clearviewport  ((43+i-1)*8-1,(34*16)+1,(43+i)*8+1,(35*16)-1,0);
   if (what == INVALID) clearviewport(24*8-1,(35*16)+1,57*8+1,(36*16)-1,0);
   if (what == IR) clearviewport     (30*8-1,(7*16)+1,34*8+1,(8*16)-1,0);
   if (what == IR2) clearviewport    (36*8-1,(7*16)+1,40*8+1,(8*16)-1,0);
   if (what == MAR) clearviewport    (55*8-1,(7*16)+1,59*8+1,(8*16)-1,0);
   if (what == MBR) clearviewport    (55*8-1,(18*16)+1,59*8+1,(19*16)-1,0);
   if (what == MEM) clearviewport    (71*8-1,((i+1)*16)+1,75*8+1,((i+2)*16)-1,0);
   if (what == MENU) clearviewport   (0,450,799,599,0);
   if (what == MICRO) clearviewport  (43*8-1,(34*16)+1,51*8+1,(35*16)-1,0);
   if (what == NZ) clearviewport     (48*8-1,(22*16)+1,50*8+1,(23*16)-1,0);
   if (what == OFF) clearviewport    (65*8-1,16,69*8+1,375,0);
   if (what == PC) clearviewport     (6*8-1,(7*16)+1,10*8+1,(8*16)-1,0);
   if (what == REG) clearviewport    (7*8-1,((15+i)*16)+1,11*8+1,((16+i)*16)-1,0);
   if (what == SP) clearviewport     (18*8-1,(7*16)+1,22*8+1,(8*16)-1,0);
}

function settextstyle(size) {
   size *= 8;
   ctx.font = size.toString() + "px myFont";
}

function line(x1, y1, x2, y2) {
   ctx.beginPath();
   ctx.moveTo(x1,y1);
   ctx.lineTo(x2,y2);
   ctx.stroke();
}

function vline(x, b, t)
{       
   line(8*x,16*b,8*x,16*(t+1));
}       
        
function hline(y, l, r)
{       
   y = 16*y;
   line(8*l,y,8*(r+1),y);
}   

function box(l, r, b, t) {               
   l=8*l;
   r=8*(r+1);
   b=(b+1)*16;
   t=t*16; 
   line(l,b,r,b);
   line(r,b,r,t);
   line(r,t,l,t);
   line(l,t,l,b);
}

function arrow(d, x, y)
{       
   if (d == 'd') {
      x=8*x; 
      y=(y+1)*16-16;
      x1=x-4;
      x2=x+4;
      y1=y-4;
      y2=y1; 
   }
   if (d == 'u') {
      x=8*x;
      y=y*16+16;
      x1=x-4;
      x2=x+4;
      y1=y+4;
      y2=y1;
   }       
   if (d == 'l') {
      x=8*x+2+0.5;
      y=y*16;
      x1=x+4;
      x2=x1;
      y1=y+4;
      y2=y-4;
   }
   if (d == 'r') {
      x=8*x+0.5;
      y=y*16;
      x1=x-4;
      x2=x1;
      y1=y+4;
      y2=y-4;
   }
   line(x,y,x1,y1);
   line(x,y,x2,y2);
}

function printat(x, y, string)
{               
   x=x*8+1;
   y=y*16+3;
   ctx.fillText(string,x,y+8);
}

function outtextxy(x, y, string)
{               
   ctx.fillText(string,x,y+8);
}

   arrow('d', 38, 13);
   arrow('d', 32, 16);
   arrow('d', 38, 16);
   arrow('d', 57, 18);
   arrow('d', 48, 22);
   point();
   
   for (i=0;i<=7;i++) {
      box(6,11,15+i,15+i);
      hline(15.5+i,12,15);
      arrow('l',11.8,15.5+i);
      arrow('r',16,15.5+i);
      temp = "R" + i.toString();
      printat(3,15+i,temp);
      printat(7,15+i,"ffff");
   }
   for (i=0;i<=21;i++) {
      box(70,75,i+1,i+1);
      temp = ('0000' + i.toString(16)).slice(-4);
      printat(65,i+1,temp);
      temp = (65535).toString(16);

function clock()
{
   cl++;
   clearer(CLOCK,0);
   temp = ('0000' + cl.toString(16)).slice(-4);
   printat(9,2,temp);
}

async function flash(x, y, i)
{
   clock();
   temp = ('0000' + i.toString(16)).slice(-4);
   printat(x,y,temp);
   await sleep(wait);
}

function clockreset()
{
   cl=0;
   clearer(CLOCK,0);
   printat(9,2,"0000");
}

function bits()
{
   var t;
   var i = 0;

   a=Math.trunc(a%65536);
   t=a;
   temp = '';
   for (i=0;i<16;i++) {
      if (Math.trunc(t%2) != 0) temp += '1';
      else temp += '0';
      t=Math.trunc(t/2);
   }
   clearer(BITS,0);
   printat(27,18,temp);
}

function c_agb()
{
   clearer(C,0);
   temp = String.fromCharCode(c+48);
   outtextxy(8*35,16*19.8,temp);
}

function cllu()
{
   if (p==1) printat(43,34,"CLC  ALU");

function a_agb()
{
   bits();
   if (a==0) z=1;
   else z=0;
   if (Math.trunc(a/32768)==1) n=1;
   else n=0;
   clearer(NZ,0);
   temp = String.fromCharCode(n+48) + String.fromCharCode(z+48);
   printat(48,22,temp);
}

function aceg()
{
   if (p==1) printat(43,34,"ADC  REG");
   a=a1+a2+c;
   c=Math.trunc(a/65536);
   c_agb();
   a_agb();
   r[rb]=a;
   clearer(REG,rb);

function deeg()
{
   if (p==1) printat(43,34,"DEC  REG");
   a--;
   if (a<0) a+=65536;
   c=Math.trunc(a/65536);
   c_agb();
   a_agb();
   if (ad==7) {
      r[ra]=a;
      clearer(REG,ra);
      flash(7,15+ra,a);
   } 
   else {
      r[rb]=a;
      clearer(REG,rb);
      flash(7,15+rb,a);

}

function select()
{
   clearer(MICRO,0);
   if (mi === "ACEG") aceg();
   if (mi === "ADAR") adar();
   if (mi === "ADPC") adpc();
   if (mi === "ADEG") adeg();
   if (mi === "ANEG") aneg();

   if (mi === "EOEG") eoeg();

   if (mi === "INEG") ineg();

   if (mi === "IRPC") irpc();
   if (mi === "LSEG") lseg();

   if (mi === "MBA2") mba2();

{

function decode2()
{
   switch (ad) {

         set[2] = "REEM";
         set[3] = "MBAR";

         break;

         set[0] = "PCAR";

         break;

         break;
      case 7:  
         ad_agb = "RPD";
         set[0] = "REA1";

   }
   if (op==0) {
      op_agb = "STO";
      s++; 
      set[s] = "REBR";
      s++;

   }
   if (op>0 && op<4) decode3();
   if (op>3) add();
}

function imp()

function rel()
{
   set[0] = "PCAR";

   if (op==26) op_agb = "BRA";
   if ((op==20 && c==1) || (op==21 && c==0) || (op==22 && z==0) || (op==23 && n==0) || (op==24 && z==1) || (op==25 && n==1)) {
      set[0] = "INPC";
      s=0;
   }
}

function reg()
{
   set[0] = "REA1";
   s=1;
   switch (op) {
      case 12: 
         op_agb = "ASL";
         set[1] = "ASEG";
         break;
      case 13: 
         op_agb = "DEC";

         break;
   }
}

function decode()
{
   var d;

   s=0;
   set[0] = "NOOP";
   d=ir;
   rb=Math.trunc(d%8); 
   d=Math.trunc(d/16);
   ra=Math.trunc(d%8);
   d=Math.trunc(d/16);
   ad=Math.trunc(d%8); 
   op=Math.trunc(d/8);
   if (op>26) {
      ad=8;

   }
   if (op<27 && op>19) {
      ad_agb = "REL";
      rel();
   }
   if (op<20 && op>11) {
      ad_agb = "REG";
      reg();
   }
   if (op<12) decode2();

   clearer(CONTROL,0);
   temp = op_agb + ' ' + ad_agb + ' R' + ra.toString() + ' R' + rb.toString();
   printat(28,4,temp);

   if (p==1) f=0;
}

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function execute(max) {       
   var x = 32;
   var jj;

   for (jj = 0; jj <= max; jj++) {
      if (mench == 5) {
         do {
            x = await getch();
         } while (x != 32 && x != 81);
         
         if (x == 81) {
            end = 1;
            return;
         }
      } else if (wait > 0) {
         await sleep(wait); 
      }
                
      clearer(MICRO, 0);
      if (f == 1) printat(43, 34, "FETCH");
      else printat(43, 34, "EXECUTE");
                
      mi = set[jj];
      select();

      if (end) return;
   }       
}

async function prog() {
   var x = 0;
   p = 1;
   end = 0;
   sp = 128;
   clearer(SP, 0);
   printat(18, 7, "0080");

   while (!end) {
      set[0] = "PCAR";
      set[1] = "INPC";
      set[2] = "REEM";
      set[3] = "MBIR";
      s = 3;

      if (mench == 4) {
         do {
            x = await getch();
         } while (x != 32 && x != 81 && x != 49 && x != 50);
         
         if (x == 81) return;
         if (x == 49) wait = 1;
         if (x == 50) wait = 100;
      }

      clockreset();
      clearer(MICRO, 0);
      printat(43, 34, "FETCH");
      f = 1;
      
      await execute(s);
      if (end) break;
      
      f = 0; // TODO: AI added this, do we need it?
      await execute(s);
      await sleep(0); 

      if (kbhit) {
         let k = await getch(); 
         if (k == 49) wait = 1;
         if (k == 50) wait = 100;
         if (k == 81) end = 1;
      }
   }

   if (op == 31) {
      clearer(MICRO, 0);
      printat(43, 34, "HALT");
      await getch();
   }
}

function getch() {
   if (kbhit) {
      keyCode = kbhit;
      kbhit = 0;
      return keyCode;
   } else return new Promise((resolve) => {
      document.addEventListener('keydown', onKeyHandler);
      function onKeyHandler(e) {
         document.removeEventListener('keydown', onKeyHandler);
         resolve(e.keyCode);
         a = getch(); // We need to do it again because of the kbhit thing
         resolve(a);
      }
   });
}

async function entry(h)
{
   var y=0;
   var s=0;
   var i=0;

   temp = String.fromCharCode(h);
   printat(49,36,temp);
   if (h<58) s=h-48;
   else s=h-55;
   for (i=1;i<=3;i++) {
      do y=await getch(); 
      while ((y<48 || y>57) && (y<65 || y>70));
      temp = String.fromCharCode(y);
      printat(49+i,36,temp);
      s*=16;
      if (y<58) s=s+y-48;
      else s=s+y-55;
   }
   m[Math.trunc(mar%128)]=s;

   clearer(MEM, mar-off);
   clearer(DATA, 0);

   temp = ('0000' + s.toString(16)).slice(-4);
   printat(71,mar+1-off, temp);
   mar++;
   point();
}

async function data()
{
   var x = 0;
   var i;

   printat(0,29,"DATA");
   printat(0,30,"ENTRY");
   printat(24,29,"Use the cursor keys to select a memory location");
   printat(24,30,"Type 4 hexadecimal digits to enter data");
   printat(24,31,"Press I to insert a blank line");
   printat(24,32,"Press Z to zero address register");
   printat(24,33,"Press R to remove the current line");
   printat(24,34,"Press Q to quit");
   printat(24,36,"Enter instruction word:");
   box(48,53,36,36);

   while (x != 81) {
      x = await getch();
      if (x==90) {
         mar=0;
         point();
      }
      if (x==38) {
         mar--;
         point();
      }
      if (x==40) {
         mar++;
         point();
      }
      if (x==73) {
         for (i=127;i>=Math.trunc(mar % 128)+1;i--) m[i]=m[i-1];
         m[Math.trunc(mar%128)]=65535;
         values();
      }
      if (x==82) {
         for (i=Math.trunc(mar%128);i<=126;i++) m[i]=m[i+1];
         m[127]=65535;
         values();
      }
      if ((x>47 && x<58) || (x>64 && x<71)) await entry(x);

      clearer(MAR,0);
      temp = ('0000' + mar.toString(16)).slice(-4);
      printat(55,7,temp);
   }
}

}

async function manent()
{
   var i=0;
   var key=0;

   mi = '';
   clearer(MICRO,0);
   while (key != 13) {
      key=await getch();
      if (key == 8) {
         if (i>0) {
            clearer(ENTRY,i);
            mi = mi.substring(0, mi.length - 1);
            i--;
         }
      }
      else if (key != 13 && i<8) {
         temp = String.fromCharCode(key);
         printat(43+i,34,temp);
         mi = mi + temp;
         i++;
      }
   }
   mi = mi.toUpperCase();
}

async function manual()
{
   var i=0, vi=0;

   wait=50; 
   p=0;
   printat(0,29,"MANUAL");
   printat(0,30,"OPERATION");
   printat(24,29,"Use LOWER CASE letters only");
   printat(24,30,"Enter any valid microinstruction");
   printat(24,31,"Enter Q to quit");
   printat(24,34,"Microinstruction:");
   box(42,51,34,34);
   clockreset();

   while (vi != 2) {
      vi=0;
      await manent();
      if (mi.slice(0,1) === "Q") vi=2;
      if (mi.length < 4) mi = "FFFF";
      if (mi.slice(0,3) === "ADC") mi = "ACEG";
      lastTwo = mi.slice(-2);
      mi = mi.substring(0, 2) + lastTwo;

      noin = ins.length;
      for (i=0;i<noin;i++) if (mi === ins[i]) vi=1;

      if (vi==0) {
         printat(24,35,"INVALID INSTRUCTION - Press a key");
         await getch();
         clearer(INVALID,0);
      }
      if (vi==1) select();
   }
}

async function menu()
{
   while (mench != 7) {
      clearer(MENU,0);
      printat(0,29,"MAIN");
      printat(0,30,"MENU");
      printat(24,29,"1.  Enter data");
      printat(24,30,"2.  Set program counter");
      printat(24,31,"3.  Run program");
      printat(24,32,"4.  Single step by instructions");
      printat(24,33,"5.  Single step by microinstructions");
      printat(24,34,"6.  Manual operation");
      printat(24,35,"7.  Finish");

      while (mench<=48 || mench>=56) mench = await getch();
      mench -= 48;

      clearer(MENU,0);

      switch (mench) {
         case 1:
            await data();
            break;
         case 2:
            await counter();
            break;
         case 3:
            await run();
            break;
         case 4:
            await step();
            break;
         case 5:
            await micro();
            break;
         case 6:
            await manual();
            break;
         case 7:
            // Doing this three times to fix anti-aliasing issues
            clearviewport(0,0,canvas.width,canvas.height,0);
            clearviewport(0,0,canvas.width,canvas.height,0);
            clearviewport(0,0,canvas.width,canvas.height,0);
            console.log('Program terminated');
            break;
      }
   }
}

function values()
{
   for (i=0;i<=21;i++) {

function off_agb(t)
{
   off=t;
   if (t>106) off=106;

   for (i=0;i<=21;i++) {
       temp = ('0000' + (off+i).toString(16)).slice(-4);

}

function lines(t)
{
   t=Math.trunc(t%128);
   if (t<off || t>off+21) off_agb(t);

   line(504,96,504,8+16*t);
   line(632,400,632,8+16*t);
   hline(t+0.5,63,63.8);
   hline(t+0.5,76.2,78);
   arrow('r',64.8,t+0.5);
   arrow('l',75.9,t+0.5);
}

function point()
{
   if (mar>127 || mar<0) mar=0;
   setcolor(0);

   // Doing this three times to fix anti-aliasing issues
   lines(omar);
   lines(omar);
   lines(omar);

   setcolor(2);
   lines(mar);
   omar=mar;
}

const readins = (callback) => {
   var request = new XMLHttpRequest();
   request.open('GET', 'microins.dat', true);
   request.send(null);
   request.onreadystatechange = function () {
      if (request.readyState === 4 && request.status === 200) {
         var type = request.getResponseHeader('Content-Type');
         if (type.indexOf("text") !== 1) {
            ins = request.responseText.match(/.{1,4}/g);
            callback(undefined);
         }
      } else if (request.readyState === 4) {
         callback("ERROR - instruction set not loaded");
      }
   }
}
